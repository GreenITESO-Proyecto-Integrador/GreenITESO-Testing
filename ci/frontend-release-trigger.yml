# OPCIONAL. Este archivo NO corre en este repo: se copia al repo de FRONTEND en
#   .github/workflows/trigger-e2e-full.yml
# Cuando se publica un release (prod) en el frontend, dispara el job de Jenkins con SUITE=full.
#
# Secrets requeridos en el repo de frontend (Settings > Secrets and variables > Actions):
#   JENKINS_URL        p. ej. https://jenkins.midominio.com  (debe ser accesible desde internet)
#   JENKINS_JOB        nombre del job, p. ej. GreenITESO-Testing
#   JENKINS_USER       usuario de Jenkins
#   JENKINS_API_TOKEN  API token del usuario (Jenkins > usuario > Configure > API Token)
#   E2E_BASE_URL       URL de prod a probar

name: Trigger E2E full suite

on:
  release:
    types: [published]

jobs:
  trigger-jenkins:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar build full en Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          curl -fsS -X POST \
            -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
            "${JENKINS_URL}/job/${JENKINS_JOB}/buildWithParameters" \
            --data-urlencode "SUITE=full" \
            --data-urlencode "BASE_URL=${E2E_BASE_URL}"
